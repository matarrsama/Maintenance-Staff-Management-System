<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased font-body-lg text-on-background">
<div class="w-full max-w-[480px]">
<!-- Logo Header -->
<div class="flex flex-col items-center mb-lg">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-sm shadow-[0px_4px_12px_rgba(0,82,255,0.1)]">
<span class="material-symbols-outlined text-[32px] text-on-primary" data-icon="local_hospital">local_hospital</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">MediFlow</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-base">Maintenance Management System</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-surface-container-highest rounded-xl p-md md:p-lg">
<form action="#" class="space-y-md" method="POST">
<!-- Employee ID / Email Field -->
<div class="space-y-base">
<label class="block font-body-md text-body-md font-bold text-on-surface" for="employee-id">Email or Employee ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]" data-icon="badge">badge</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-surface-container-highest rounded bg-surface-container-lowest text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors font-body-md text-body-md" id="employee-id" name="employee-id" placeholder="e.g. M-10492" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-base">
<div class="flex items-center justify-between">
<label class="block font-body-md text-body-md font-bold text-on-surface" for="password">Password</label>
<a class="font-body-md text-body-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-surface-container-highest rounded bg-surface-container-lowest text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded bg-primary text-on-primary font-body-lg text-body-lg font-medium hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors mt-lg" type="submit">
                    Sign In
                </button>
</form>
</div>
<!-- System Notice -->
<div class="mt-lg text-center bg-surface-container-low rounded-lg p-sm border border-surface-container-highest">
<div class="flex items-start md:items-center justify-center gap-2 text-left md:text-center">
<span class="material-symbols-outlined text-secondary text-[20px] shrink-0" data-icon="info">info</span>
<p class="font-body-md text-body-md text-secondary">
                    Account creation is managed by the Department Head. Please contact the HOD to request a new account.
                </p>
</div>
</div>
</div>
</body></html>
