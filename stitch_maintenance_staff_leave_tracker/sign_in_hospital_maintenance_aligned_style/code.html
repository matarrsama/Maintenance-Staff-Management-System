<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - Hospital Maintenance System</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "surface-tint": "#4059aa",
                        "inverse-surface": "#213145",
                        "primary": "#00236f",
                        "on-secondary-container": "#006f66",
                        "on-primary-container": "#90a8ff",
                        "on-primary": "#ffffff",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed": "#89f5e7",
                        "on-surface": "#0b1c30",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "secondary-container": "#86f2e4",
                        "surface-bright": "#f8f9ff",
                        "tertiary-container": "#3d4143",
                        "on-primary-fixed-variant": "#264191",
                        "tertiary": "#272b2d",
                        "secondary": "#006a61",
                        "surface-container-highest": "#d3e4fe",
                        "surface": "#f8f9ff",
                        "on-surface-variant": "#444651",
                        "surface-container": "#e5eeff",
                        "primary-container": "#1e3a8a",
                        "primary-fixed": "#dce1ff",
                        "tertiary-fixed": "#e0e3e5",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "inverse-primary": "#b6c4ff",
                        "on-tertiary-fixed": "#191c1e",
                        "on-primary-fixed": "#00164e",
                        "outline": "#757682",
                        "surface-container-high": "#dce9ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-background": "#0b1c30",
                        "on-secondary-fixed": "#00201d",
                        "background": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#aaadaf",
                        "secondary-fixed-dim": "#6bd8cb",
                        "primary-fixed-dim": "#b6c4ff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c5c5d3",
                        "on-tertiary-fixed-variant": "#444749",
                        "on-secondary-fixed-variant": "#005049"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "data-density-comfortable": "16px",
                        "data-density-compact": "8px",
                        "section-gap": "32px",
                        "unit": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "data-mono": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center font-body-md text-on-surface p-container-padding antialiased"><!-- Auth Container -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded shadow-sm overflow-hidden flex flex-col relative z-10">
<!-- Header Section -->
<header class="bg-surface-container-low border-b border-outline-variant p-6 flex flex-col items-center text-center">
<div class="w-12 h-12 bg-primary-container rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-on-primary text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    health_and_safety
                </span>
</div>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Hospital Maintenance</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Secure Staff Authentication</p>
</header>
<!-- Form Section -->
<div class="p-6">
<form action="#" class="space-y-5" method="POST">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="email">Hospital Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-lg">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors h-[40px]" id="email" name="email" placeholder="staff.member@hospital.org" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-lg">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors h-[40px]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full flex justify-center items-center py-2 px-4 bg-primary-container text-on-primary rounded font-label-md text-label-md hover:bg-primary transition-colors shadow-sm active:shadow-inner h-[40px]" type="submit">
                        Sign In
                    </button>
</div>
<!-- Security Note -->
<div class="flex items-start mt-6 p-3 bg-surface rounded border border-outline-variant border-dashed">
<span class="material-symbols-outlined text-primary text-sm mr-2 mt-0.5">shield</span>
<p class="font-body-sm text-body-sm text-on-surface-variant text-[12px]">
                        This is a secure system restricted to authorized hospital personnel only. All activities are monitored and logged.
                    </p>
</div>
</form>
</div>
</main>
<!-- Decorative Background Element -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center opacity-5">
<span class="material-symbols-outlined text-[400px] text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
            local_hospital
        </span>
</div></body></html>
